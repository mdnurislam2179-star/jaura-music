<!DOCTYPE html>
<html lang="bn"><link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#ffffff">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JAURA MUSIC</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#b30000;
    color:#fff;
}

header{
    padding:16px;
    text-align:center;
    background:#8b0000;
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    font-size:25px;
    font-weight:bold;
    margin-bottom:12px;
}

.search-box{
    display:flex;
    gap:8px;
}

.search-box input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
    outline:none;
    font-size:15px;
}

.search-box button{
    padding:12px 16px;
    border:none;
    border-radius:8px;
    background:#fff;
    color:#b30000;
    font-weight:bold;
    cursor:pointer;
}

.player-box{
    width:100%;
    background:#000;
}

.player-box iframe{
    width:100%;
    aspect-ratio:16/9;
    border:0;
    display:block;
}

.now-playing{
    padding:12px;
    background:#8b0000;
    font-size:15px;
    font-weight:bold;
}

#videoList{
    padding:10px;
}

.video{
    display:flex;
    gap:10px;
    margin-bottom:12px;
    padding:8px;
    background:#8b0000;
    border-radius:10px;
    cursor:pointer;
}

.video img{
    width:130px;
    height:74px;
    object-fit:cover;
    border-radius:7px;
}

.video-info{
    flex:1;
}

.video-title{
    font-size:14px;
    font-weight:bold;
    line-height:1.35;
}

.channel{
    font-size:12px;
    margin-top:7px;
    opacity:.85;
}

.status{
    text-align:center;
    padding:20px;
}

</style>
</head>

<body>

<header>
    <div class="logo">😈 JAURA MUSIC</div>

    <div class="search-box">
        <input id="searchInput" type="text" placeholder="YouTube ভিডিও সার্চ করো...">
        <button onclick="searchVideos()">SEARCH</button>
    </div>
</header>

<div class="player-box">
    <iframe
        id="player"
        src=""
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>
</div>

<div class="now-playing" id="nowPlaying">
    ভিডিও নির্বাচন করো 🎵
</div>

<div id="videoList">
    <div class="status">ভিডিও লোড হচ্ছে...</div>
</div>

<script>

/* =========================================
   🔑 এখানে তোমার YouTube API KEY বসানো হয়েছে
   ========================================= */

const API_KEY = "AIzaSyB0v6AdruCXxW4ZS_xKCrB8cnc6TItXwCs";


/* =========================================
   🎬 ভিডিও প্লে
   ========================================= */

function playVideo(videoId,title){

    document.getElementById("player").src =
        "https://www.youtube.com/embed/" +
        videoId +
        "?autoplay=1&rel=0";

    document.getElementById("nowPlaying").innerText =
        title;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================================
   🏠 ওপেন করলেই জনপ্রিয় ভিডিও
   ========================================= */

async function loadHomeVideos(){

    const list = document.getElementById("videoList");

    list.innerHTML =
        '<div class="status">নতুন ভিডিও লোড হচ্ছে...</div>';

    try{

        const url =
        "https://www.googleapis.com/youtube/v3/videos" +
        "?part=snippet,contentDetails" +
        "&chart=mostPopular" +
        "&regionCode=BD" +
        "&maxResults=20" +
        "&key=" + API_KEY;

        const response = await fetch(url);
        const data = await response.json();

        if(data.error){

            list.innerHTML =
                '<div class="status">API Key অথবা YouTube API সেটিংসে সমস্যা আছে।</div>';

            console.log(data.error);
            return;
        }

        showVideos(data.items);

    }catch(error){

        list.innerHTML =
            '<div class="status">ভিডিও লোড করা যাচ্ছে না।</div>';

        console.log(error);
    }
}


/* =========================================
   🔍 সার্চ
   ========================================= */

async function searchVideos(){

    const query =
        document.getElementById("searchInput").value.trim();

    if(!query){
        loadHomeVideos();
        return;
    }

    const list = document.getElementById("videoList");

    list.innerHTML =
        '<div class="status">সার্চ করা হচ্ছে...</div>';

    try{

        const url =
        "https://www.googleapis.com/youtube/v3/search" +
        "?part=snippet" +
        "&q=" + encodeURIComponent(query) +
        "&type=video" +
        "&maxResults=20" +
        "&key=" + API_KEY;

        const response = await fetch(url);
        const data = await response.json();

        if(data.error){

            list.innerHTML =
                '<div class="status">API Key অথবা API সেটিংসে সমস্যা আছে।</div>';

            console.log(data.error);
            return;
        }

        const videos = data.items.map(item => ({

            id:{
                videoId:item.id.videoId
            },

            snippet:item.snippet

        }));

        showVideos(videos);

    }catch(error){

        list.innerHTML =
            '<div class="status">সার্চ করা যাচ্ছে না।</div>';

        console.log(error);
    }
}


/* =========================================
   📋 ভিডিও লিস্ট দেখানো
   ========================================= */

function showVideos(videos){

    const list =
        document.getElementById("videoList");

    list.innerHTML = "";

    if(!videos || videos.length === 0){

        list.innerHTML =
            '<div class="status">কোনো ভিডিও পাওয়া যায়নি।</div>';

        return;
    }

    videos.forEach(video => {

        const videoId =
            video.id.videoId || video.id;

        const snippet =
            video.snippet;

        const title =
            snippet.title;

        const thumbnail =
            snippet.thumbnails.high
            ? snippet.thumbnails.high.url
            : snippet.thumbnails.default.url;

        const channel =
            snippet.channelTitle;

        const item =
            document.createElement("div");

        item.className = "video";

        item.innerHTML = `
            <img src="${thumbnail}" alt="">
            <div class="video-info">
                <div class="video-title">
                    ${escapeHTML(title)}
                </div>

                <div class="channel">
                    ${escapeHTML(channel)}
                </div>
            </div>
        `;

        item.onclick = function(){

            playVideo(videoId,title);

        };

        list.appendChild(item);

    });
}


/* =========================================
   🛡️ নিরাপদ Text
   ========================================= */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================================
   ⌨️ Enter দিয়ে সার্চ
   ========================================= */

document
.getElementById("searchInput")
.addEventListener("keydown",function(event){

    if(event.key === "Enter"){
        searchVideos();
    }

});


/* =========================================
   🚀 অ্যাপ ওপেন হলেই ভিডিও লোড
   ========================================= */

loadHomeVideos();

</script><script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
        navigator.serviceWorker.register("./sw.js");
    });
}
</script>

</body>
</html>
